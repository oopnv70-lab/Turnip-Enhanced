name: sync-upstream
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: merge upstream
        run: |
          git config user.name Operit
          git config user.email operit@users.noreply.github.com
          git remote add upstream https://github.com/LFRon/Turnip-Enhanced.git
          git fetch upstream main
          git log --oneline -1 upstream/main
          git merge --no-edit upstream/main -m sync-merge-upstream || true
          echo CONFLICTS
          git diff --name-only --diff-filter=U
          for f in $(git diff --name-only --diff-filter=U); do
            case $f in
              docs/features.txt) git checkout --theirs $f ;;
              *) git checkout --ours $f ;;
            esac
            git add $f
            echo resolved $f
          done
          git commit --no-edit
          git push origin main
          echo MERGE_OK
